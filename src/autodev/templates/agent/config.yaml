# autodev project configuration.

# Shell commands the quality gates run. null = skipped.
commands:
  build: null  # e.g. "npm run build"; compiles/builds the project
  test: null   # e.g. "pytest"; runs the test suite
  lint: null   # e.g. "ruff check ."; runs linters/type checks

git:
  main_branch: main
  remote: null

limits:
  max_attempts: 3  # review/QA rejections before a story is blocked
  command_timeout_s: 900  # max seconds for each build/test/lint command
  max_discovery_turns: 20  # max agent turns in the interactive discovery chat

# Which Claude Code settings agent sessions load (authentication lives there).
runtime:
  # project = this repo's .claude/ settings only. Adding `user` inherits all of
  # ~/.claude (auth, but also your global CLAUDE.md, hooks, plugins, permissions).
  setting_sources: [project]
  # Extra settings JSON passed to every agent session: path relative to .agent/,
  # absolute, or ~/... Prefer this to load only what agents need, e.g. a file
  # containing just {"apiKeyHelper": "..."} copied from ~/.claude/settings.json.
  settings: null

# Existing docs in the repo that agents read in place, e.g. [README.md, docs/].
# Directories contribute their *.md, *.txt, *.rst and *.adoc files (recursively).
context:
  paths: []

# Files matching these globs (fnmatch on the repo-relative path; * also matches /) are test files.
# A red commit may only touch test files, a green commit may not touch them.
tdd:
  test_globs:
    - "tests/*"
    - "test/*"
    - "*/tests/*"
    - "*/test/*"
    - "test_*.py"
    - "*/test_*.py"
    - "*_test.py"
    - "*_test.go"
    - "*.test.*"
    - "*.spec.*"

# `autodev run` suggests `autodev improve` once this many stories reached DONE since the last improve.
improve:
  every_n_stories: 5

# effort is one of low|medium|high|xhigh|max.
# `prompt` may point to a file in process/ (path relative to .agent/) to override the built-in prompt.
# `tools` is the only set of tools the agent can use; roles without `tools` get
# [Read, Write, Edit, Glob, Grep, Bash]. An explicit [] means no tools.
# `skills` is `all`, a list of skill names, or omitted for none. Skills come from the project's
# .claude/skills/, and from ~/.claude only if `runtime.setting_sources` includes `user`.
# `max_budget_usd` caps the spend of a single agent run; omit it for no cap.
agents:
  defaults:
    model: claude-opus-5-5
    effort: high
    max_turns: 50
    # max_budget_usd: 5.0
  roles:
    discovery:
      model: claude-opus-5-5
      effort: high
      tools: [Read, Grep, Glob]
    architect:
      model: claude-opus-5-5
      effort: xhigh
      tools: [Read, Grep, Glob]
    refiner:
      model: claude-opus-5-5
      effort: high
      tools: [Read, Grep, Glob]
    test_writer:
      model: claude-sonnet-5-5
      effort: medium
      skills: all
    implementer:
      model: claude-sonnet-5-5
      effort: medium
      skills: all
    reviewer:
      model: claude-opus-5-5
      effort: high
      tools: [Read, Grep, Glob, Bash]
    qa:
      model: claude-opus-5-5
      effort: high
      tools: [Read, Grep, Glob, Bash]
    merger:
      model: claude-sonnet-5-5
      effort: medium
    improver:
      model: claude-opus-5-5
      effort: high
      tools: [Read, Grep, Glob]
