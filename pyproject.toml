[project]
name = "autodev"
version = "0.1.0"
description = "CLI that orchestrates AI agents to build software"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "typer",
    "rich",
    "claude-agent-sdk>=0.2.178",
]

[project.scripts]
autodev = "autodev.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodev"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real model (deselected by default)"]
